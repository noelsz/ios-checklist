name: ChecklistApp
options:
  bundleIdPrefix: com.noelsz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_IDENTIFIER: group.com.noelsz.ioschecklist
targets:
  ChecklistApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noelsz.ioschecklist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Config/Checklist.entitlements
    dependencies:
      - target: ChecklistWidgetExtension
  ChecklistWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noelsz.ioschecklist.widget
        INFOPLIST_KEY_CFBundleDisplayName: Checklist Widget
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Config/ChecklistWidget.entitlements
  ChecklistAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedTests
        excludes:
          - Package.swift
    dependencies:
      - target: ChecklistApp
